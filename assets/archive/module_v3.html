<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Coordinate Trainer</title>
  <script>
    // 🔐 SECURITY CHECK - Redirect if not coming from portal
    if (sessionStorage.getItem('auth') !== 'true') {
        // Not authorized – send back to main robotics page
        window.location.href = '../../index.html';
    } else {
        // Authorized – remove the flag so it's one-time use
        sessionStorage.removeItem('auth');
    }
</script>
  <style>
    :root {
      --light: #f0d9b5;
      --dark: #b58863;
      --bg: #161512;
      --text: #fff;
      --panel-bg: #262421;
      --overlay-color: #ffffffcc;
      --overlay-wrong: #e74c3c;
      --target-border: #ffff00;
      /* Dynamic board sizing to fill most of the screen */
      --board-size: min(75vw, 80vh);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh; /* Allow body to grow instead of locking to viewport */
      display: flex;
      justify-content: center;
      user-select: none;
      padding: 40px 20px; /* Add padding so it doesn't hug the screen edges when scrolling */
    }
    
    .trainer-container {
      width: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1200px;
    }
    
    .header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }
    
    .title {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: bold;
      color: #ffcf0a;
    }

    .main-row {
      display: flex;
      flex: 1;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap; /* Allow wrapping on extremely small screens */
    }

    /* --- Left Panel Controls --- */
    .left-panel {
      width: 250px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      flex-shrink: 0;
    }

    .btn-group {
      display: flex;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
    }

    .btn-group button {
      flex: 1;
      background: transparent;
      border: none;
      color: #aaa;
      padding: 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-group button.active {
      background: #d85000;
      color: white;
      font-weight: bold;
    }

    .btn-group button:hover:not(.active) {
      background: #444;
      color: white;
    }

    .toggle-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
      color: #aaa;
    }

    .toggle-list label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 1rem;
    }

    /* --- Center Board Area --- */
    .board-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .board-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ranks {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      height: var(--board-size); 
      font-size: 1rem;
      color: #aaa;
      width: 15px;
      text-align: right;
    }

    .board-outer {
      display: flex;
      flex-direction: column;
    }

    .board {
      display: grid;
      /* minmax forces the grid to stay perfectly uniform regardless of content */
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      width: var(--board-size);
      height: var(--board-size);
      border: 3px solid #3a3a3a;
      border-radius: 4px;
      position: relative;
    }

    .files {
      display: flex;
      justify-content: space-around;
      width: var(--board-size); 
      font-size: 1rem;
      color: #aaa;
      margin-top: 5px;
    }

    .square {
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .square.light { background: var(--light); }
    .square.dark  { background: var(--dark); }
    
    .square:hover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }

    .square.target-highlight {
      box-shadow: inset 0 0 0 4px var(--target-border);
      z-index: 2;
    }

    .piece {
      position: absolute; /* Prevents pieces from changing the grid square size */
      font-size: calc(var(--board-size) * 0.09); /* Scales proportionally with the board */
      opacity: 0.9;
      pointer-events: none;
    }

    .coord-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: calc(var(--board-size) * 0.2); 
      font-weight: bold;
      pointer-events: none;
      color: var(--overlay-color);
      text-shadow: 0 0 20px rgba(0,0,0,0.9);
      z-index: 5;
      transition: color 0.15s;
    }

    .coord-overlay.wrong { color: var(--overlay-wrong); }

    .type-input-area {
      display: flex;
      gap: 10px;
      margin-top: 25px; /* Added extra margin so it's easier to see/scroll to */
      margin-bottom: 25px;
      justify-content: center;
      width: 100%;
    }

    .type-input-area input {
      padding: 15px;
      border: 2px solid #555;
      border-radius: 6px;
      background: #2b2b2b;
      color: white;
      width: 150px;
      text-align: center;
      font-size: 1.5rem;
      outline: none;
      transition: 0.2s;
    }

    .type-input-area input:focus { border-color: #d85000; }

    /* --- Right Panel Stats --- */
    .right-panel {
      width: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      background: var(--panel-bg);
      padding: 25px;
      border-radius: 12px;
      height: fit-content;
      flex-shrink: 0;
    }

    .timer-big {
      font-size: 3rem;
      font-weight: bold;
      color: #ffcf0a;
    }

    .score-big {
      font-size: 4rem;
      font-weight: bold;
      line-height: 1;
    }

    .score-label {
      color: #aaa;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .action-btn {
      width: 100%;
      padding: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.2s;
    }

    .start-btn { background: #3692e7; }
    .start-btn:hover { background: #2a7ac4; }
    
    .restart-btn { background: #444; }
    .restart-btn:hover { background: #666; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="trainer-container">
  <div class="header">
    <div class="title">Vision</div>
  </div>

  <div class="main-row">
    
    <div class="left-panel">
      <div class="btn-group">
        <button id="mode-click" class="active">Find square</button>
        <button id="mode-type">Name square</button>
      </div>

      <div class="btn-group">
        <button id="time-inf">∞</button>
        <button id="time-30s" class="active">0:30</button>
      </div>

      <div class="btn-group">
        <button id="color-white" class="active">White</button>
        <button id="color-black">Black</button>
      </div>

      <div class="toggle-list">
        <label><input type="checkbox" id="show-coords" checked> Show coordinates</label>
        <label><input type="checkbox" id="show-pieces"> Show pieces</label>
      </div>
    </div>

    <div class="board-area">
      <div class="board-container">
        <div class="ranks" id="ranks-labels"></div>
        <div class="board-outer">
          <div class="board" id="board">
            <div class="coord-overlay" id="coord-overlay"></div>
          </div>
          <div class="files" id="files-labels"></div>
        </div>
      </div>
      
      <div class="type-input-area hidden" id="type-input-area">
        <input type="text" id="type-input" placeholder="e.g. e4" maxlength="2" autocomplete="off">
      </div>
    </div>

    <div class="right-panel">
      <div class="timer-big" id="timer-display">0:30</div>
      <div class="score-big" id="score">0</div>
      <div class="score-label">Score</div>
      <button id="start-btn" class="action-btn start-btn">Start Training</button>
      <button id="restart-btn" class="action-btn restart-btn hidden">Restart</button>
    </div>
    
  </div>
</div>

<script>
  const files = ['a','b','c','d','e','f','g','h'];
  let flipped = false;
  let showCoords = true;
  let showPieces = false;
  let mode = 'click'; // 'click' or 'type'
  let timeMode = '30s'; // '30s' or 'inf'
  
  let score = 0;
  let currentTarget = '';
  let timerActive = false;
  let timerInterval = null;
  let gameActive = false;

  const boardEl = document.getElementById('board');
  const ranksEl = document.getElementById('ranks-labels');
  const filesEl = document.getElementById('files-labels');
  let coordOverlay = document.getElementById('coord-overlay');
  
  const scoreEl = document.getElementById('score');
  const timerDisplay = document.getElementById('timer-display');
  
  const typeInputArea = document.getElementById('type-input-area');
  const typeInput = document.getElementById('type-input');
  
  const startBtn = document.getElementById('start-btn');
  const restartBtn = document.getElementById('restart-btn');

  function updateStats(correct) {
    if (correct) score++;
    scoreEl.textContent = score;
  }

  function getRandomCoord() {
    const file = files[Math.floor(Math.random() * 8)];
    const rank = Math.floor(Math.random() * 8) + 1;
    return file + rank;
  }

  function applyTargetHighlight() {
    document.querySelectorAll('.square.target-highlight').forEach(s => s.classList.remove('target-highlight'));
    if (!currentTarget || mode !== 'type') return;
    const targetSquare = document.querySelector(`.square[data-coord="${currentTarget}"]`);
    if (targetSquare) targetSquare.classList.add('target-highlight');
  }

  function setTarget() {
    currentTarget = getRandomCoord();
    if (mode === 'click') {
      coordOverlay.textContent = currentTarget;
      coordOverlay.classList.remove('wrong');
      applyTargetHighlight(); 
    } else {
      coordOverlay.textContent = '';
      coordOverlay.classList.remove('wrong');
      applyTargetHighlight();
    }
  }

  const pieceMap = {
    a8:'♜', b8:'♞', c8:'♝', d8:'♛', e8:'♚', f8:'♝', g8:'♞', h8:'♜',
    a7:'♟', b7:'♟', c7:'♟', d7:'♟', e7:'♟', f7:'♟', g7:'♟', h7:'♟',
    a2:'♙', b2:'♙', c2:'♙', d2:'♙', e2:'♙', f2:'♙', g2:'♙', h2:'♙',
    a1:'♖', b1:'♘', c1:'♗', d1:'♕', e1:'♔', f1:'♗', g1:'♘', h1:'♖',
  };

  function buildBoard() {
    boardEl.innerHTML = '<div class="coord-overlay" id="coord-overlay"></div>';
    coordOverlay = document.getElementById('coord-overlay');

    const rankOrder = flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
    const fileOrder = flipped ? [...files].reverse() : files;
    const fragment = document.createDocumentFragment();

    for (const rank of rankOrder) {
      for (const file of fileOrder) {
        const square = document.createElement('div');
        square.classList.add('square');
        
        // Correct coloring logic: a1 is always dark, regardless of perspective
        const isEvenLight = (files.indexOf(file) + rank) % 2 === 0;
        square.classList.add(isEvenLight ? 'light' : 'dark');
        
        const coord = file + rank;
        square.dataset.coord = coord;
        square.addEventListener('click', handleSquareClick);
        
        if (showPieces && pieceMap[coord]) {
          const pieceSpan = document.createElement('span');
          pieceSpan.className = 'piece';
          pieceSpan.textContent = pieceMap[coord];
          square.appendChild(pieceSpan);
        }
        fragment.appendChild(square);
      }
    }
    boardEl.appendChild(fragment);

    // Update coordinate labels
    ranksEl.innerHTML = rankOrder.map(r => `<span>${r}</span>`).join('');
    filesEl.innerHTML = fileOrder.map(f => `<span>${f}</span>`).join('');

    // Restore text or highlights if game is running
    if (gameActive) {
      if (mode === 'click') coordOverlay.textContent = currentTarget;
      else applyTargetHighlight();
    }
  }

  function handleSquareClick(e) {
    if (!gameActive || mode !== 'click') return;
    const clicked = e.currentTarget.dataset.coord;

    if (clicked === currentTarget) {
      updateStats(true);
      setTarget();
    } else {
      coordOverlay.classList.add('wrong');
      setTimeout(() => coordOverlay.classList.remove('wrong'), 300);
    }
  }

  typeInput.addEventListener('input', (e) => {
    if (!gameActive || mode !== 'type') return;
    const answer = e.target.value.trim().toLowerCase();
    
    // Check match instantly without needing to press enter
    if (answer.length === 2) {
      if (answer === currentTarget) {
        updateStats(true);
        e.target.value = '';
        setTarget();
      } else {
        e.target.style.borderColor = '#e74c3c';
        setTimeout(() => { e.target.style.borderColor = '#555'; e.target.value = ''; }, 300);
      }
    }
  });

  function startTimer() {
    stopTimer();
    timerActive = true;
    
    if (timeMode === 'inf') {
      timerDisplay.textContent = '∞';
      return;
    }

    let seconds = 30;
    const endTime = Date.now() + seconds * 1000;
    timerDisplay.textContent = seconds.toFixed(1);
    
    timerInterval = setInterval(() => {
      const remaining = Math.max(0, (endTime - Date.now()) / 1000);
      timerDisplay.textContent = remaining.toFixed(1);
      if (remaining <= 0) {
        endGame();
      }
    }, 100);
  }

  function stopTimer() {
    timerActive = false;
    if (timerInterval) clearInterval(timerInterval);
  }

  function startGame() {
    score = 0;
    scoreEl.textContent = '0';
    gameActive = true;
    
    startBtn.classList.add('hidden');
    restartBtn.classList.remove('hidden');
    
    setTarget();
    startTimer();
    
    if (mode === 'type') {
      typeInput.value = '';
      typeInput.focus();
    }
  }

  function endGame() {
    stopTimer();
    gameActive = false;
    restartBtn.classList.add('hidden');
    startBtn.classList.remove('hidden');
    startBtn.textContent = "Play Again";
    
    coordOverlay.textContent = '';
    document.querySelectorAll('.square.target-highlight').forEach(s => s.classList.remove('target-highlight'));
    typeInput.value = '';
  }

  function restartGame() {
    endGame();
    startGame();
  }

  // Bindings for Mode toggles
  document.getElementById('mode-click').addEventListener('click', (e) => {
    mode = 'click';
    e.target.classList.add('active');
    document.getElementById('mode-type').classList.remove('active');
    typeInputArea.classList.add('hidden');
    if (gameActive) {
      coordOverlay.textContent = currentTarget;
      applyTargetHighlight();
    }
  });

  document.getElementById('mode-type').addEventListener('click', (e) => {
    mode = 'type';
    e.target.classList.add('active');
    document.getElementById('mode-click').classList.remove('active');
    typeInputArea.classList.remove('hidden');
    if (gameActive) {
      coordOverlay.textContent = '';
      applyTargetHighlight();
      typeInput.focus();
    }
  });

  // Bindings for Time toggles
  document.getElementById('time-inf').addEventListener('click', (e) => {
    timeMode = 'inf';
    e.target.classList.add('active');
    document.getElementById('time-30s').classList.remove('active');
    timerDisplay.textContent = '∞';
    if (gameActive) startTimer(); // update current running timer
  });

  document.getElementById('time-30s').addEventListener('click', (e) => {
    timeMode = '30s';
    e.target.classList.add('active');
    document.getElementById('time-inf').classList.remove('active');
    timerDisplay.textContent = '0:30';
    if (gameActive) startTimer(); // restart current running timer
  });

  // Bindings for Color toggles
  document.getElementById('color-white').addEventListener('click', (e) => {
    flipped = false;
    e.target.classList.add('active');
    document.getElementById('color-black').classList.remove('active');
    buildBoard();
  });

  document.getElementById('color-black').addEventListener('click', (e) => {
    flipped = true;
    e.target.classList.add('active');
    document.getElementById('color-white').classList.remove('active');
    buildBoard();
  });

  // Checkboxes
  document.getElementById('show-coords').addEventListener('change', (e) => {
    showCoords = e.target.checked;
    ranksEl.style.visibility = showCoords ? 'visible' : 'hidden';
    filesEl.style.visibility = showCoords ? 'visible' : 'hidden';
  });

  document.getElementById('show-pieces').addEventListener('change', (e) => {
    showPieces = e.target.checked;
    buildBoard();
  });

  // Action Buttons
  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', restartGame);

  // Initialize
  buildBoard();
  timerDisplay.textContent = timeMode === '30s' ? '30.0' : '∞';

</script>
</body>
</html>
