<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess Coordinate Trainer</title>
  <script>
    // 🔐 SECURITY CHECK - Redirect if not coming from portal
    if (sessionStorage.getItem('auth') !== 'true') {
        // Not authorized – send back to main robotics page
        window.location.href = '../../index.html';
    } else {
        // Authorized – remove the flag so it's one-time use
        sessionStorage.removeItem('auth');
    }
  </script>
  <style>
    :root {
      --light: #f0d9b5;
      --dark: #b58863;
      --bg: #161512;
      --text: #fff;
      --panel-bg: #262421;
      --overlay-color: #ffffffcc;
      --overlay-wrong: #e74c3c;
      --target-border: #ffff00;
      /* Dynamic board sizing to fill most of the screen */
      --board-size: min(75vw, 80vh);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      overscroll-behavior-y: none; /* Helps prevent bounce-scrolling on mobile */
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      /* Use svh to account for mobile keyboards/toolbars, fallback to vh */
      min-height: 100vh;
      min-height: 100svh; 
      display: flex;
      justify-content: center;
      user-select: none;
      padding: 40px 20px;
    }
    
    .trainer-container {
      width: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1200px;
    }
    
    .header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }
    
    .title {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: bold;
      color: #ffcf0a;
    }

    .main-row {
      display: flex;
      flex: 1;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* --- Left Panel Controls --- */
    .left-panel {
      width: 250px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      flex-shrink: 0;
    }

    .btn-group {
      display: flex;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
      flex-wrap: wrap;
    }

    .btn-group button {
      flex: 1 1 50%;
      background: transparent;
      border: none;
      color: #aaa;
      padding: 12px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-group.modes button {
      font-size: 0.85rem;
      padding: 12px 2px;
    }

    .btn-group button.active {
      background: #d85000;
      color: white;
      font-weight: bold;
    }

    .btn-group button:hover:not(.active) {
      background: #444;
      color: white;
    }

    .toggle-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
      color: #aaa;
    }

    .toggle-list label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 1rem;
    }

    /* --- Center Board Area --- */
    .board-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .board-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Arithmetic Mode specific container */
    .math-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: calc(var(--board-size) + 20px); 
      height: calc(var(--board-size) + 20px);
      background: #262421;
      border: 3px solid #3a3a3a;
      border-radius: 4px;
    }

    .math-prompt {
      font-size: clamp(4rem, 15vw, 10rem);
      color: #ffcf0a;
      font-weight: bold;
      text-align: center;
      line-height: 1;
    }

    /* Furigana Styling */
    ruby { ruby-position: over; }
    rt {
      font-size: 0.4em;
      color: #888;
      font-weight: normal;
      margin-bottom: 5px;
    }

    .ranks {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      height: var(--board-size); 
      font-size: 1rem;
      color: #aaa;
      width: 15px;
      text-align: right;
    }

    .board-outer {
      display: flex;
      flex-direction: column;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      width: var(--board-size);
      height: var(--board-size);
      border: 3px solid #3a3a3a;
      border-radius: 4px;
      position: relative;
    }

    .files {
      display: flex;
      justify-content: space-around;
      width: var(--board-size); 
      font-size: 1rem;
      color: #aaa;
      margin-top: 5px;
    }

    .square {
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .square.light { background: var(--light); }
    .square.dark  { background: var(--dark); }
    
    .square:hover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }

    .square.target-highlight {
      box-shadow: inset 0 0 0 4px var(--target-border);
      z-index: 2;
    }

    .piece {
      position: absolute;
      font-size: calc(var(--board-size) * 0.09);
      opacity: 0.9;
      pointer-events: none;
    }

    .coord-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: calc(var(--board-size) * 0.2); 
      font-weight: bold;
      pointer-events: none;
      color: var(--overlay-color);
      text-shadow: 0 0 20px rgba(0,0,0,0.9);
      z-index: 5;
      transition: color 0.15s;
    }

    .coord-overlay.wrong { color: var(--overlay-wrong); }

    /* Input Section */
    .input-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      margin-top: 25px;
      margin-bottom: 25px;
      width: 100%;
    }

    .move-prompt {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffcf0a;
      text-align: center;
    }

    .move-log {
      font-size: 1.1rem;
      color: #888;
      text-align: center;
      min-height: 1.5rem; /* Prevents jumping when toggled/empty */
      margin-bottom: 5px;
    }

    .input-section input {
      padding: 15px;
      border: 2px solid #555;
      border-radius: 6px;
      background: #2b2b2b;
      color: white;
      width: 150px;
      text-align: center;
      font-size: 1.5rem;
      outline: none;
      transition: 0.2s;
    }

    .input-section input:focus { border-color: #d85000; }

    /* --- Right Panel Stats --- */
    .right-panel {
      width: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      background: var(--panel-bg);
      padding: 25px;
      border-radius: 12px;
      height: fit-content;
      flex-shrink: 0;
    }

    .timer-big {
      font-size: 3rem;
      font-weight: bold;
      color: #ffcf0a;
    }

    .score-big {
      font-size: 4rem;
      font-weight: bold;
      line-height: 1;
    }

    .score-label {
      color: #aaa;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .action-btn {
      width: 100%;
      padding: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.2s;
    }

    .start-btn { background: #3692e7; }
    .start-btn:hover { background: #2a7ac4; }
    
    .restart-btn { background: #444; }
    .restart-btn:hover { background: #666; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="trainer-container">
  <div class="header">
    <div class="title">Vision</div>
  </div>

  <div class="main-row">
    
    <div class="left-panel">
      <div class="btn-group modes">
        <button id="mode-click" class="active">Find</button>
        <button id="mode-type">Name</button>
        <button id="mode-move">Move piece</button>
        <button id="mode-arithmetic">Arithmetic</button>
      </div>

      <div class="btn-group">
        <button id="time-inf">∞</button>
        <button id="time-30s" class="active">0:30</button>
      </div>

      <div class="btn-group">
        <button id="color-white" class="active">White</button>
        <button id="color-black">Black</button>
      </div>

      <div class="toggle-list">
        <label><input type="checkbox" id="show-coords" checked> Show coordinates</label>
        <label><input type="checkbox" id="show-pieces"> Show pieces</label>
        <label id="furigana-label" class="hidden"><input type="checkbox" id="show-furigana"> Furigana (Math)</label>
      </div>
    </div>

    <div class="board-area">
      
      <div class="board-wrapper" id="board-wrapper">
        <div class="ranks" id="ranks-labels"></div>
        <div class="board-outer">
          <div class="board" id="board">
            <div class="coord-overlay" id="coord-overlay"></div>
          </div>
          <div class="files" id="files-labels"></div>
        </div>
      </div>

      <div class="math-container hidden" id="math-wrapper">
        <div id="math-prompt" class="math-prompt"></div>
      </div>
      
      <div class="input-section hidden" id="input-section">
        <div id="move-prompt" class="move-prompt hidden"></div>
        <div id="move-log" class="move-log hidden"></div>
        <input type="text" id="type-input" placeholder="e.g. e4" maxlength="3" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
      </div>

    </div>

    <div class="right-panel">
      <div class="timer-big" id="timer-display">0:30</div>
      <div class="score-big" id="score">0</div>
      <div class="score-label">Score</div>
      <button id="start-btn" class="action-btn start-btn">Start Training</button>
      <button id="restart-btn" class="action-btn restart-btn hidden">Restart</button>
    </div>
    
  </div>
</div>

<script>
  const files = ['a','b','c','d','e','f','g','h'];
  let flipped = false;
  let showCoords = true;
  let showPieces = false;
  let showFurigana = false;
  let mode = 'click'; // 'click', 'type', 'move', 'arithmetic'
  let timeMode = '30s'; 
  
  let score = 0;
  let currentTarget = '';
  
  // Move piece mode variables
  let movePieceType = ''; 
  let moveStart = '';
  let moveCurrent = '';
  let moveTarget = '';

  // Arithmetic mode variables
  let mathFile1 = 0;
  let mathFile2 = 0;

  let timerActive = false;
  let timerInterval = null;
  let gameActive = false;

  const boardEl = document.getElementById('board');
  const boardWrapper = document.getElementById('board-wrapper');
  const mathWrapper = document.getElementById('math-wrapper');
  const ranksEl = document.getElementById('ranks-labels');
  const filesEl = document.getElementById('files-labels');
  let coordOverlay = document.getElementById('coord-overlay');
  
  const scoreEl = document.getElementById('score');
  const timerDisplay = document.getElementById('timer-display');
  
  const inputSection = document.getElementById('input-section');
  const movePromptEl = document.getElementById('move-prompt');
  const moveLogEl = document.getElementById('move-log');
  const typeInput = document.getElementById('type-input');
  
  const startBtn = document.getElementById('start-btn');
  const restartBtn = document.getElementById('restart-btn');

  function updateStats(correct) {
    if (correct) score++;
    scoreEl.textContent = score;
  }

  function getRandomCoord() {
    const file = files[Math.floor(Math.random() * 8)];
    const rank = Math.floor(Math.random() * 8) + 1;
    return file + rank;
  }

  function getSquareColorParity(coord) {
    const fileIdx = files.indexOf(coord[0]);
    const rank = parseInt(coord[1]);
    return (fileIdx + rank) % 2;
  }

  function isValidMove(piece, from, to) {
    const f1 = files.indexOf(from[0]);
    const r1 = parseInt(from[1]);
    const f2 = files.indexOf(to[0]);
    const r2 = parseInt(to[1]);
    const dx = Math.abs(f1 - f2);
    const dy = Math.abs(r1 - r2);

    if (piece === 'N') {
      return (dx === 1 && dy === 2) || (dx === 2 && dy === 1);
    } else if (piece === 'B') {
      return (dx === dy && dx > 0);
    }
    return false;
  }

  function applyTargetHighlight() {
    document.querySelectorAll('.square.target-highlight').forEach(s => s.classList.remove('target-highlight'));
    
    // In 'move' mode, NO target should be highlighted.
    if (mode === 'type' && currentTarget) {
      const targetElement = document.querySelector(`.square[data-coord="${currentTarget}"]`);
      if (targetElement) targetElement.classList.add('target-highlight');
    }
  }

  function renderMathPrompt() {
    const f1 = files[mathFile1];
    const f2 = files[mathFile2];
    const num1 = mathFile1 + 1; // 1-indexed for pure chess math
    const num2 = mathFile2 + 1;

    if (showFurigana) {
      document.getElementById('math-prompt').innerHTML = `<ruby>${f1}<rt>${num1}</rt></ruby> - <ruby>${f2}<rt>${num2}</rt></ruby>`;
    } else {
      document.getElementById('math-prompt').innerHTML = `${f1} - ${f2}`;
    }
  }

  function setTarget() {
    if (mode === 'click' || mode === 'type') {
      currentTarget = getRandomCoord();
      if (mode === 'click') {
        coordOverlay.textContent = currentTarget;
        coordOverlay.classList.remove('wrong');
      } else {
        coordOverlay.textContent = '';
      }
      applyTargetHighlight(); 
    } 
    else if (mode === 'move') {
      coordOverlay.textContent = '';
      movePieceType = Math.random() < 0.5 ? 'N' : 'B';
      moveStart = getRandomCoord();
      do {
        moveTarget = getRandomCoord();
      } while (moveStart === moveTarget);
      
      moveCurrent = moveStart;
      
      const pieceName = movePieceType === 'N' ? 'Knight' : 'Bishop';
      movePromptEl.textContent = `${pieceName}: ${moveStart} ➔ ${moveTarget}`;
      moveLogEl.textContent = `Current: ${moveStart}`;
      
      // Imaginary piece logic: DO NOT draw the active piece or highlight target
      applyTargetHighlight();
    }
    else if (mode === 'arithmetic') {
      mathFile1 = Math.floor(Math.random() * 8);
      mathFile2 = Math.floor(Math.random() * 8);
      while (mathFile1 === mathFile2) {
        mathFile2 = Math.floor(Math.random() * 8);
      }
      renderMathPrompt();
    }
  }

  function showWrongInput(inputEl) {
    inputEl.style.borderColor = '#e74c3c';
    setTimeout(() => { 
      inputEl.style.borderColor = '#555'; 
      inputEl.value = ''; 
    }, 300);
  }

  const pieceMap = {
    a8:'♜', b8:'♞', c8:'♝', d8:'♛', e8:'♚', f8:'♝', g8:'♞', h8:'♜',
    a7:'♟', b7:'♟', c7:'♟', d7:'♟', e7:'♟', f7:'♟', g7:'♟', h7:'♟',
    a2:'♙', b2:'♙', c2:'♙', d2:'♙', e2:'♙', f2:'♙', g2:'♙', h2:'♙',
    a1:'♖', b1:'♘', c1:'♗', d1:'♕', e1:'♔', f1:'♗', g1:'♘', h1:'♖',
  };

  function buildBoard() {
    // Rebuild only if we aren't using the arithmetic math view
    if (mode === 'arithmetic') return;

    boardEl.innerHTML = '<div class="coord-overlay" id="coord-overlay"></div>';
    coordOverlay = document.getElementById('coord-overlay');

    const rankOrder = flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
    const fileOrder = flipped ? [...files].reverse() : files;
    const fragment = document.createDocumentFragment();

    for (const rank of rankOrder) {
      for (const file of fileOrder) {
        const square = document.createElement('div');
        square.classList.add('square');
        
        const isEvenLight = (files.indexOf(file) + rank) % 2 === 0;
        square.classList.add(isEvenLight ? 'light' : 'dark');
        
        const coord = file + rank;
        square.dataset.coord = coord;
        square.addEventListener('click', handleSquareClick);
        
        // Disable "Show pieces" behavior entirely if mode is "move"
        if (showPieces && mode !== 'move' && pieceMap[coord]) {
          const pieceSpan = document.createElement('span');
          pieceSpan.className = 'piece';
          pieceSpan.textContent = pieceMap[coord];
          square.appendChild(pieceSpan);
        }
        fragment.appendChild(square);
      }
    }
    boardEl.appendChild(fragment);

    ranksEl.innerHTML = rankOrder.map(r => `<span>${r}</span>`).join('');
    filesEl.innerHTML = fileOrder.map(f => `<span>${f}</span>`).join('');

    if (gameActive) {
      if (mode === 'click') coordOverlay.textContent = currentTarget;
      applyTargetHighlight();
    }
  }

  function handleSquareClick(e) {
    if (!gameActive || mode !== 'click') return;
    const clicked = e.currentTarget.dataset.coord;

    if (clicked === currentTarget) {
      updateStats(true);
      setTarget();
    } else {
      coordOverlay.classList.add('wrong');
      setTimeout(() => coordOverlay.classList.remove('wrong'), 300);
    }
  }

  typeInput.addEventListener('input', (e) => {
    if (!gameActive || mode === 'click') return;
    const answer = e.target.value.trim().toLowerCase();
    
    // Safely clear input without triggering iOS auto-scroll bounce
    const clearInput = () => setTimeout(() => { e.target.value = ''; }, 10);

    if (mode === 'type') {
      if (answer.length === 2) {
        if (answer === currentTarget) {
          updateStats(true);
          clearInput();
          setTarget();
        } else {
          showWrongInput(e.target);
        }
      }
    } 
    else if (mode === 'move') {
      if (answer === 'imp') {
        let isImpossible = false;
        if (movePieceType === 'B') {
          isImpossible = getSquareColorParity(moveStart) !== getSquareColorParity(moveTarget);
        }
        
        if (isImpossible) {
          updateStats(true);
          clearInput();
          setTarget();
        } else {
          showWrongInput(e.target);
        }
      } 
      else if (answer.length === 2 && /^[a-h][1-8]$/.test(answer)) {
        if (isValidMove(movePieceType, moveCurrent, answer)) {
          moveCurrent = answer;
          clearInput();
          moveLogEl.textContent = `Current: ${moveCurrent}`;
          
          if (moveCurrent === moveTarget) {
            updateStats(true);
            setTarget();
          }
        } else {
          showWrongInput(e.target);
        }
      }
    }
    else if (mode === 'arithmetic') {
      const parsedAns = parseInt(answer);
      if (!isNaN(parsedAns)) {
        const expected = Math.abs(mathFile1 - mathFile2);
        if (parsedAns === expected) {
          updateStats(true);
          clearInput();
          setTarget();
        } else {
          showWrongInput(e.target);
        }
      }
    }
  });

  function startTimer() {
    stopTimer();
    timerActive = true;
    
    if (timeMode === 'inf') {
      timerDisplay.textContent = '∞';
      return;
    }

    let seconds = 30;
    const endTime = Date.now() + seconds * 1000;
    timerDisplay.textContent = seconds.toFixed(1);
    
    timerInterval = setInterval(() => {
      const remaining = Math.max(0, (endTime - Date.now()) / 1000);
      timerDisplay.textContent = remaining.toFixed(1);
      if (remaining <= 0) {
        endGame();
      }
    }, 100);
  }

  function stopTimer() {
    timerActive = false;
    if (timerInterval) clearInterval(timerInterval);
  }

  function startGame() {
    score = 0;
    scoreEl.textContent = '0';
    gameActive = true;
    
    startBtn.classList.add('hidden');
    restartBtn.classList.remove('hidden');
    
    setTarget();
    startTimer();
    
    if (mode !== 'click') {
      typeInput.value = '';
      typeInput.focus();
    }
  }

  function endGame() {
    stopTimer();
    gameActive = false;
    restartBtn.classList.add('hidden');
    startBtn.classList.remove('hidden');
    startBtn.textContent = "Play Again";
    
    if (mode !== 'arithmetic') {
      coordOverlay.textContent = '';
      document.querySelectorAll('.square.target-highlight').forEach(s => s.classList.remove('target-highlight'));
      buildBoard(); // Restores pieces if show pieces was toggled
    }
    
    typeInput.value = '';
  }

  function restartGame() {
    endGame();
    startGame();
  }

  // --- Mode Switches & UI Resets ---
  function resetInputState() {
    boardWrapper.classList.remove('hidden');
    mathWrapper.classList.add('hidden');
    
    inputSection.classList.add('hidden');
    movePromptEl.classList.add('hidden');
    moveLogEl.classList.add('hidden');
    document.getElementById('furigana-label').classList.add('hidden');
    
    coordOverlay.textContent = '';
    typeInput.value = '';
  }

  document.getElementById('mode-click').addEventListener('click', (e) => {
    mode = 'click';
    document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    
    resetInputState();
    buildBoard();
    if (gameActive) {
      coordOverlay.textContent = currentTarget;
      applyTargetHighlight();
    }
  });

  document.getElementById('mode-type').addEventListener('click', (e) => {
    mode = 'type';
    document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    
    resetInputState();
    buildBoard();
    inputSection.classList.remove('hidden');
    typeInput.placeholder = "e.g. e4";
    typeInput.maxLength = 2;
    
    if (gameActive) {
      applyTargetHighlight();
      typeInput.focus();
    }
  });

  document.getElementById('mode-move').addEventListener('click', (e) => {
    mode = 'move';
    document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    
    resetInputState();
    buildBoard(); 
    inputSection.classList.remove('hidden');
    movePromptEl.classList.remove('hidden');
    moveLogEl.classList.remove('hidden');
    typeInput.placeholder = "e.g. f4 or imp";
    typeInput.maxLength = 3;
    
    if (gameActive) {
      setTarget();
      typeInput.focus();
    }
  });

  document.getElementById('mode-arithmetic').addEventListener('click', (e) => {
    mode = 'arithmetic';
    document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    
    resetInputState();
    
    boardWrapper.classList.add('hidden');
    mathWrapper.classList.remove('hidden');
    document.getElementById('furigana-label').classList.remove('hidden');
    
    inputSection.classList.remove('hidden');
    typeInput.placeholder = "e.g. 2";
    typeInput.maxLength = 1;

    if (gameActive) {
      setTarget();
      typeInput.focus();
    } else {
      document.getElementById('math-prompt').innerHTML = "?";
    }
  });


  // Bindings for Time toggles
  document.getElementById('time-inf').addEventListener('click', (e) => {
    timeMode = 'inf';
    e.target.classList.add('active');
    document.getElementById('time-30s').classList.remove('active');
    timerDisplay.textContent = '∞';
    if (gameActive) startTimer();
  });

  document.getElementById('time-30s').addEventListener('click', (e) => {
    timeMode = '30s';
    e.target.classList.add('active');
    document.getElementById('time-inf').classList.remove('active');
    timerDisplay.textContent = '0:30';
    if (gameActive) startTimer();
  });

  // Bindings for Color toggles
  document.getElementById('color-white').addEventListener('click', (e) => {
    flipped = false;
    e.target.classList.add('active');
    document.getElementById('color-black').classList.remove('active');
    buildBoard();
  });

  document.getElementById('color-black').addEventListener('click', (e) => {
    flipped = true;
    e.target.classList.add('active');
    document.getElementById('color-white').classList.remove('active');
    buildBoard();
  });

  // Checkboxes
  document.getElementById('show-coords').addEventListener('change', (e) => {
    showCoords = e.target.checked;
    ranksEl.style.visibility = showCoords ? 'visible' : 'hidden';
    filesEl.style.visibility = showCoords ? 'visible' : 'hidden';
  });

  document.getElementById('show-pieces').addEventListener('change', (e) => {
    showPieces = e.target.checked;
    buildBoard();
  });

  document.getElementById('show-furigana').addEventListener('change', (e) => {
    showFurigana = e.target.checked;
    if (mode === 'arithmetic' && gameActive) {
      renderMathPrompt();
    }
  });

  // Action Buttons
  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', restartGame);

  // Initialize
  buildBoard();
  timerDisplay.textContent = timeMode === '30s' ? '30.0' : '∞';

</script>
</body>
</html>
